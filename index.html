<style>
:root{--bg:#f4f6f9;--c:#fff;--t:#1b1f24;--m:#667085;--b:#e1e4ea;--p:#1f6feb;--g:#1a7f37;--r:#cf222e;--y:#9a6700}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--c:#1a1f26;--t:#e8ebef;--m:#98a2b3;--b:#2c333d;--p:#4c8dff;--g:#3fb950;--r:#f85149;--y:#d29922}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--t)}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
nav b{margin-right:12px;align-self:center}
nav button{border:0;background:none;color:var(--m);padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--p);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:0 0 12px;font-size:18px}h3{margin:18px 0 8px;font-size:15px;color:var(--m)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.k,.box{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px}
.k span{display:block;color:var(--m);font-size:13px}.k b{font-size:22px}
.G{color:var(--g)}.R{color:var(--r)}.Y{color:var(--y)}.m{color:var(--m)}

<nav id="nav"></nav><main id="v"></main>
<script>
const LOGO=document.querySelector('link[rel=icon]').href;const K='boxmgr1';let D;
try{D=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
D={cash0:0,fixed:0,items:[],bills:[],exp:[],prods:[],cv:null,chk:{},parties:[],cap:[],myState:'Delhi',...(D||{})};
function mig(){if(D.cv&&D.cv.sm==null)D.cv.sm=0;(D.prods||[]).forEach(p=>{if(p.v&&p.v.sm==null)p.v.sm=0})}mig();
const save=()=>{let ch=false;try{ch=stamp();localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Could not save. Browser storage is blocked.')}if(ch)schedSync()};
const $=i=>document.getElementById(i),n=x=>parseFloat(x)||0,uid=()=>Date.now()+Math.random();
const sum=a=>a.reduce((x,y)=>x+y,0);const bs=b=>b.base!=null?b.base:b.amt;
const F={Bills:{},Stock:{},Expenses:{},Calculator:{},Accounts:{}},BODY={},CATS=['Rent','Salary','Electricity','Phone/Internet','Transport','Interest/EMI','Tax/GST','Personal draw','Other'];
let LAST={c:0,sp:0};

const f=x=>'₹'+n(x).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const td=()=>new Date().toISOString().slice(0,10);
const addDays=(d,k)=>{const x=new Date(d);x.setDate(x.getDate()+k);return x.toISOString().slice(0,10)};
const dd=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const val=i=>$(i).value;
const tbl=(h,r)=>`<div class=w><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')||`<tr><td colspan=${h.length} class=m>Nothing yet</td></tr>`}</table></div>`;
const card=(t,v,c='')=>`<div class=k><span>${t}</span><b class="${c}">${v}</b></div>`;
const inp=(id,l,v,t='number',x='')=>`<label>${l}<input id=${id} type=${t} value="${esc(v)}" ${x}></label>`;

/* DASHBOARD */
function dash(){
const S=D.bills.filter(b=>b.t=='S'),P=D.bills.filter(b=>b.t=='P'),rem=b=>b.amt-b.paid;
const rec=sum(S.map(rem)),pay=sum(P.map(rem));
const cash=D.cash0+sum(S.map(b=>b.paid))-sum(P.map(b=>b.paid))-sum(D.exp.map(e=>e.amt));
const sv=sum(D.items.map(i=>i.qty*i.rate));
const m=td().slice(0,7),ms=sum(S.filter(b=>b.date.startsWith(m)).map(bs)),
mp=sum(P.filter(b=>b.date.startsWith(m)).map(bs)),me=sum(D.exp.filter(e=>e.date.startsWith(m)).map(e=>e.amt)),gO=sum(S.filter(b=>b.date.startsWith(m)).map(b=>b.gst||0)),gI=sum(P.filter(b=>b.date.startsWith(m)).map(b=>b.gst||0));
const ag=[0,0,0,0];
S.filter(b=>rem(b)>0).forEach(b=>{const l=dd(addDays(b.date,b.days),td());ag[l<=0?0:l<=30?1:l<=60?2:3]+=rem(b)});
const by={};S.forEach(b=>by[b.party]=(by[b.party]||0)+bs(b));
const tot=sum(Object.values(by)),top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
const al=[];
D.items.filter(i=>i.min>0&&i.qty<=i.min).forEach(i=>al.push(`Low stock: ${esc(i.name)} (${i.qty} ${esc(i.unit)} left)`));
const od=ag[1]+ag[2]+ag[3];if(od>0)al.push(`Overdue from clients: ${f(od)}. Follow up today.`);
if(top&&tot>0&&top[1]/tot>.25)al.push(`${esc(top[0])} is ${Math.round(top[1]/tot*100)}% of your sales. Keep any one client under 25%.`);
if(D.fixed>0&&cash<D.fixed)al.push('Cash is below one month of your fixed costs.');
if(pay>cash+rec*0.5&&pay>0)al.push(`You owe suppliers ${f(pay)}. Check you can pay on time.`);
const s90=sum(S.filter(b=>dd(b.date,td())<=90).map(b=>b.amt)),p90=sum(P.filter(b=>dd(b.date,td())<=90).map(b=>b.amt));
const rd=s90>0?Math.round(rec/s90*90):0,pd=p90>0?Math.round(pay/p90*90):0,mo=D.fixed>0?cash/D.fixed:null,np=ms>0?(ms-mp-me)/ms*100:null;
if(rd>45)al.push(`Clients take about ${rd} days to pay. Aim for 30-45. Ask for advance and stop supply to slow payers.`);
if(!D.bills.length&&!D.items.length)al.push('Start here: enter opening cash in Settings, add your stock, then record every sale and purchase bill. Read the Guide tab for what to do and what not to do.');
return `<h2>Dashboard</h2>
${al.map(a=>`<div class=al>${a}</div>`).join('')}
<div class=g>${card('Cash in hand / bank',f(cash),cash<0?'R':'G')}${card('Clients owe you',f(rec))}${card('You owe suppliers',f(pay))}${card('Stock value',f(sv))}
${card('Net position (cash + receivables + stock - payables)',f(cash+rec+sv-pay),cash+rec+sv-pay<0?'R':'G')}</div>
<h3>This month</h3><div class=g>${card('Sales (before GST)',f(ms))}${card('Pieces sold',sum(S.filter(b=>b.date.startsWith(m)).map(b=>b.qty||0)).toLocaleString('en-IN'))}${card('Purchases (before GST)',f(mp))}${card('Expenses',f(me))}${card('Rough result (sales - purchases - expenses)',f(ms-mp-me),ms-mp-me<0?'R':'G')}${card('GST charged on sales',f(gO))}${card('GST paid on purchases',f(gI))}${card('Net GST (negative = credit with govt)',f(gO-gI),gO-gI<0?'Y':'R')}</div>
<h3>Health check</h3><div class=g>${card('Days clients take to pay',rd+' days',rd>45?'R':'G')}${card('Days you take to pay suppliers',pd+' days')}${card('Cash covers fixed costs for',mo==null?'Set fixed costs in Calculator':mo.toFixed(1)+' months',mo!=null&&mo<1?'R':'G')}${card('Rough profit % this month',np==null?'-':np.toFixed(1)+'%',np!=null&&np<0?'R':'G')}</div><p class=m>Targets: clients pay within 30-45 days. Cash covers at least 1-2 months of fixed costs.</p>
<h3>Money clients owe you, by age</h3><div class=g>${card('Not due yet',f(ag[0]))}${card('1-30 days late',f(ag[1]),'Y')}${card('31-60 days late',f(ag[2]),'R')}${card('Above 60 days late',f(ag[3]),'R')}</div>
<h3>Sales by client</h3>${tbl(['Client','Sales','Share'],Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${f(v)}</td><td>${Math.round(v/tot*100)}%</td></tr>`))}
<p class=m>Rough result is not exact profit, because stock bought is not always stock used. Ask your CA for true profit.</p>`}

/* CALCULATOR */
const DEF={nm:'',sm:1,sl:40,sw:28,up:1,bl:14.2,bw:12.6,bh:6.4,fl:1.4,ol:'',ow:'',dx:1,dg:285,dr:52,lx:1,ld:350,ply:2.5,lg:150,fg:125,pr:43,jw:2.48,pt:1.73,tr:1,di:.5,dsg:.5,sh:1,ms:0,qty:1000,mg:10,sp:35,fx:0};
const NUM=['sl','sw','up','bl','bw','bh','fl','dg','dr','ld','ply','lg','fg','pr','jw','pt','tr','di','dsg','sh','ms','qty','mg','sp','fx'];
const inc=(x,m)=>{x=n(x);if(!m)return x;const w=Math.trunc(x);return w+Math.round((x-w)*10)/8};
const badS=x=>{x=n(x);return x>0&&(Math.abs(x*10-Math.round(x*10))>1e-6||Math.round((x-Math.trunc(x))*10)>7)};
const sec=(t,h)=>`<div class=box style="margin-bottom:14px"><h3 style="margin-top:0">${t}</h3><div class=f style="margin:0">${h}</div></div>`;
function calc(){const v={...DEF,fx:D.fixed,...(D.cv||{})};
const I=(i,l)=>inp(i,l,v[i],'number','step=any oninput=stale()');
const CB=(i,l)=>`<label style="flex-direction:row;align-items:center;gap:8px;color:var(--t)"><input type=checkbox id=${i} ${v[i]?'checked':''} onchange=stale()> ${l}</label>`;
return `<h2>Cost Calculator</h2><div class=box style="margin-bottom:14px"><div class=f style="margin:0">${inp('nm','Box name (e.g. 3-ply 14.2x12.6x6.4 carton)',v.nm,'text','oninput=stale() style="width:320px"')}<label>Register this box under a party?<select id=cp onchange=cpChg()><option value="">No party</option>${D.parties.map(p=>`<option value="${p.id}" ${v.cp==p.id?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="__new">+ Create new party...</option></select></label></div></div><div class=two><div>
${sec('1. Sheet and box size (inches)',CB('sm','Sizes are in inch.suta (1 inch = 8 suta, so 14.4 = 14 and a half inch)')+I('sl','Sheet length')+I('sw','Sheet width')+I('up','Boxes made from one sheet')+I('bl','Box length')+I('bw','Box width')+I('bh','Box height')+I('fl','Pasting flap')+inp('ol','Blank length (optional)',v.ol,'number','step=any oninput=stale()')+inp('ow','Blank width (optional)',v.ow,'number','step=any oninput=stale()'))}
${sec('2. Duplex',CB('dx','Duplex used in this box')+I('dg','Duplex GSM (250, 285, 300...)')+I('dr','Duplex rate (₹/kg)'))}
${sec('3. Lamination',CB('lx','Lamination used in this box')+I('ld','Divide sheet size by (default 350)'))}
${sec('4. Kraft paper',`<label>Plies<select id=ply onchange=stale()>${[[2.5,'3 ply (x2.5)'],[5,'5 ply (x5)'],[7.5,'7 ply (x7.5)']].map(([a,b])=>`<option value=${a} ${v.ply==a?'selected':''}>${b}</option>`).join('')}</select></label>`+I('lg','Top / liner paper GSM')+I('fg','Flute paper GSM')+I('pr','Paper rate (₹/kg)'))}
${sec('5. Other costs per box (₹)',I('jw','Making (job work)')+I('pt','Printing')+I('tr','Cartage')+I('di','Die')+I('dsg','Design')+I('sh','Shortage')+I('ms','Misc'))}
${sec('6. Selling',I('qty','Order quantity')+I('mg','Target margin %')+I('sp','Your selling price per box (₹)')+I('fx','Fixed monthly costs (₹)'))}
<button class=a onclick=run(1)>Calculate</button> <button class=s onclick=saveP()>Save this product</button> <span id=st class=m style="margin-left:8px"></span></div><div class=box id=out style="align-self:start"></div></div>
<h3>Saved box prices</h3>${fbar('Calculator','')}<div id=res>${BODY.Calculator()}</div>`}
const g=i=>n(val(i));
function grab(){D.cv={};NUM.forEach(i=>D.cv[i]=g(i));D.cv.ol=val('ol');D.cv.ow=val('ow');D.cv.nm=val('nm').trim();D.cv.cp=val('cp');['dx','lx','sm'].forEach(i=>D.cv[i]=$(i).checked?1:0);D.fixed=g('fx');save()}
function stale(){grab();$('out').style.opacity=.4;$('st').textContent='Inputs changed. Press Calculate.'}
function run(sc){
grab();$('out').style.opacity=1;$('st').textContent='✓ Calculated at '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const m=D.cv.sm,I=k=>inc(g(k),m),up=g('up')||1,ply=g('ply');
const SL=I('sl'),SW=I('sw'),A=SL*SW;
/* grams = sheet length x sheet width x GSM / 1550 ; cost = grams / 1000 x rate per kg */
const dG=D.cv.dx?A*g('dg')/1550:0,dC=dG/1000*g('dr');
const avg=(g('lg')+g('fg'))/2,pG=A*avg*ply/1550,pC=pG/1000*g('pr');
const lC=D.cv.lx&&g('ld')>0?A/g('ld'):0;
const sc3=dC+pC+lC,oth=g('jw')+g('pt')+g('tr')+g('di')+g('dsg')+g('sh')+g('ms');
const c=sc3/up+oth;
const bL=n($('ol').value)>0?inc($('ol').value,m):2*(I('bl')+I('bw'))+I('fl'),bW=n($('ow').value)>0?inc($('ow').value,m):I('bw')+I('bh'),ba=bL*bW;
const fits=(bL<=SL&&bW<=SW)||(bL<=SW&&bW<=SL),wp=A>0?(A-up*ba)/A:0,wc=sc3*Math.max(wp,0)/up;
const bad=m?['sl','sw','bl','bw','bh','fl','ol','ow'].filter(k=>badS($(k).value)):[];
const tp=g('mg')<100?c/(1-g('mg')/100):0,sp=g('sp'),mg=sp-c,c5=c+(dC+pC)/up*.05,be=mg>0?Math.ceil(g('fx')/mg):0;
const R=(a,b,d)=>`<tr><td>${a}</td><td>${b}</td><td>${f(d)}</td></tr>`;
LAST={c,sp};$('out').innerHTML=(bad.length?`<p class=R><b>Check sizes:</b> in inch.suta mode use one digit after the point, from 0 to 7 (14.4 = 14 and a half). Wrong fields: ${bad.join(', ')}.</p>`:'')+
`<h3 style="margin-top:0">${D.cv.nm?esc(D.cv.nm)+' - ':''}1. Actual cost per box</h3><div class=g>${card('Total cost per box',f(c),'G')}${card('Paper used per box (duplex + kraft)',((dG+pG)/up).toFixed(1)+' g')}</div>
<p class=m>Sizes used: sheet ${SL} x ${SW} in, blank ${bL.toFixed(2)} x ${bW.toFixed(2)} in. Nothing is deducted from this cost.</p>`+
tbl(['Item','Grams','Cost'],[
`<tr><td>Duplex${D.cv.dx?' ('+g('dg')+' GSM)':' (off)'}</td><td>${(dG/up).toFixed(1)} g</td><td>${f(dC/up)}</td></tr>`,
`<tr><td>Kraft paper (avg ${avg} GSM x ${ply})</td><td>${(pG/up).toFixed(1)} g</td><td>${f(pC/up)}</td></tr>`,
R('Lamination'+(D.cv.lx?' (sheet / '+g('ld')+')':' (off)'),'',lC/up),R('Making (job work)','',g('jw')),R('Printing','',g('pt')),R('Cartage','',g('tr')),R('Die','',g('di')),R('Design','',g('dsg')),R('Shortage','',g('sh')),R('Misc','',g('ms')),
`<tr><td><b>Total cost per box</b></td><td></td><td><b>${f(c)}</b></td></tr>`])+
`<h3>2. Pricing and profit</h3><div class=g>${card('Price for your target margin',f(tp),'G')}${card('Margin at your price',f(mg)+' ('+(sp?(mg/sp*100).toFixed(1):0)+'%)',mg<=0?'R':'G')}
${card('Order revenue',f(sp*g('qty')))}${card('Order profit',f(mg*g('qty')),mg<=0?'R':'G')}
${card('Margin if paper and duplex rise 5%',f(sp-c5),sp-c5<=0?'R':'Y')}${card('Boxes per month to cover fixed costs',mg>0&&g('fx')>0?be.toLocaleString('en-IN'):'-')}</div>
<h3>3. Wastage (sheet to box)</h3>`+(wp<0?`<p class=Y>The box blank is bigger than the sheet. Check the sheet size.</p>`:`<div class=g>${card('Wastage on this box',(wp*100).toFixed(1)+'%',wp>.25?'R':'Y')}${card('Wastage cost per box',f(wc),'R')}${card('Wastage cost on this order',f(wc*g('qty')),'R')}</div>
<p class=m>Wastage is only shown for your information. It is already inside the paper, duplex and lamination cost above, so it is not deducted or added again. It is the part of the sheet's cost that is cut away.</p>`+(fits?'':`<p class=Y>This blank does not fit the sheet as one piece. The waste figure is an area estimate, so type the real blank size in section 1 if your box is made another way.</p>`));
if(sc)$('out').scrollIntoView({behavior:'smooth',block:'nearest'})}
function loadP(i){D.cv={...D.prods[i].v};go('Calculator')}
function delP(i){if(confirm('Delete this product?')){D.prods.splice(i,1);save();go('Calculator')}}

/* STOCK */
function adj(id,s){const i=D.items.find(x=>x.id==id),q=n(prompt((s>0?'Quantity received':'Quantity used or sold')+' ('+i.unit+')'));if(!q)return;if(s<0&&q>i.qty&&!confirm('More than stock in hand. Continue?'))return;i.qty+=s*q;save();go('Stock')}
function rate(id){const i=D.items.find(x=>x.id==id),r=prompt('New cost per unit (₹)',i.rate);if(r===null)return;i.rate=n(r);save();go('Stock')}
function delI(id){if(confirm('Delete item?')){D.items=D.items.filter(x=>x.id!=id);save();go('Stock')}}

/* BILLS */
function bills(){const ps=plist();return `<h2>Sales and purchase bills</h2><div class=f><label>Type<select id=bt onchange=bchg()><option value=S>Sale (client owes me)</option><option value=P>Purchase (I owe supplier)</option></select></label>
${inp('bp','Party name (pick from Accounts)','','text','list=pl onchange=pickP()')}<datalist id=pl>${ps.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>${inp('bd','Bill date',td(),'date')}${inp('bq','Quantity','','number','step=any oninput=bprev()')}${inp('br','Rate per piece (₹, before GST)','','number','step=any oninput=bprev()')}${inp('bg','GST %',5,'number','step=any oninput=bprev()')}<label>Party location<select id=bi onchange=bprev()><option value=0>Same state (CGST + SGST)</option><option value=1>Other state (IGST)</option></select></label>${inp('bc','Credit days','30')}<button class=a onclick=addB()>Add bill</button></div>
<div id=pinfo style="margin:-6px 0 6px"></div><div id=bpv style="margin:-4px 0 14px"></div>
${fbar('Bills',fin('Bills','from','From','date')+fin('Bills','to','To','date')+fsel('Bills','t','Type',[['','Sale + Purchase'],['S','Sales'],['P','Purchases']])+fsel('Bills','s','Status',[['','All'],['open','Unpaid'],['late','Overdue'],['paid','Paid']])+fsel('Bills','o','Sort by',[['new','Newest first'],['old','Oldest first'],['amt','Amount (high to low)'],['party','Party A-Z']]))}<div id=res>${BODY.Bills()}</div>`}
BODY.Bills=()=>{const rem=b=>b.amt-b.paid,x=F.Bills;
const a=D.bills.filter(b=>fmatch(b,'Bills',b.party+' '+(b.t=='S'?'sale':'purchase'))&&(!x.t||b.t==x.t)&&(!x.from||b.date>=x.from)&&(!x.to||b.date<=x.to)&&(!x.s||(x.s=='paid'?rem(b)<=0:x.s=='open'?rem(b)>0:rem(b)>0&&dd(addDays(b.date,b.days),td())>0)));
const o=x.o||'new';a.sort(o=='old'?(p,q)=>p.date.localeCompare(q.date):o=='amt'?(p,q)=>q.amt-p.amt:o=='party'?(p,q)=>p.party.localeCompare(q.party):(p,q)=>q.date.localeCompare(p.date));
const rows=a.map(b=>{const due=addDays(b.date,b.days),l=dd(due,td()),r=rem(b);
const st=r<=0?'<span class=G>Paid</span>':l>0?`<b class=R>Overdue ${l}d</b>`:`<span class=m>Due in ${-l}d</span>`;
const gt=b.gst!=null?`${f(b.gst)}<br><span class=m style="font-size:12px">${b.ig?'IGST '+b.gr+'%':'CGST '+f(b.gst/2)+' + SGST '+f(b.gst/2)}</span>`:'-';
return `<tr><td>${b.t=='S'?'Sale':'Purchase'}</td><td>${esc(b.party)}</td><td>${b.date}</td><td>${due}</td><td>${b.qty||'-'}</td><td>${b.rate!=null?f(b.rate):(b.qty?f(b.amt/b.qty):'-')}</td><td>${f(bs(b))}</td><td>${gt}</td><td>${f(b.amt)}</td><td>${f(b.paid)}</td><td>${f(r)}</td><td>${st}</td><td>${r>0?`<button class=s onclick="pay(${b.id})">Record payment</button>`:''}</td><td><button class=s onclick="delB(${b.id})">Delete</button></td></tr>`});

const tot=`<tr><td colspan=6><b>Total (${a.length} bills)</b></td><td><b>${f(sum(a.map(bs)))}</b></td><td><b>${f(sum(a.map(b=>b.gst||0)))}</b></td><td><b>${f(sum(a.map(b=>b.amt)))}</b></td><td><b>${f(sum(a.map(b=>b.paid)))}</b></td><td><b>${f(sum(a.map(rem)))}</b></td><td></td><td></td><td></td></tr>`;
return fsum('Bills')+tbl(['Type','Party','Date','Due','Qty','Rate/pc','Before GST','GST','Total','Paid','Balance','Status','',''],[...rows,a.length?tot:''])};
const r2=x=>Math.round(x*100)/100;
function bcalc(){const q=n(val('bq')),r=n(val('br')),gr=n(val('bg')),ig=val('bi')=='1',base=r2(q*r),gst=r2(base*gr/100);return{q,r,gr,ig,base,gst,tot:r2(base+gst)}}
function bprev(){const c=bcalc(),h=c.ig?`IGST ${c.gr}% = ${f(c.gst)}`:`CGST ${c.gr/2}% = ${f(c.gst/2)} + SGST ${c.gr/2}% = ${f(c.gst/2)}`;
const p=pby(val('bp')),out=p&&val('bt')=='S'?sum(pbills(p).filter(b=>b.t=='S').map(b=>b.amt-b.paid)):0;
const w=p&&p.limit>0&&val('bt')=='S'&&out+c.tot>p.limit?`<br><b class=R>Credit limit warning: ${esc(p.name)} already owes ${f(out)}. With this bill it goes above the limit of ${f(p.limit)}.</b>`:'';
$('bpv').innerHTML=`<b>${f(c.base)}</b> before GST + ${h} = <b>Total ${f(c.tot)}</b>${w}`}
function bchg(){$('bg').value=val('bt')=='P'?18:5;bprev()}
function addB(){const c=bcalc();if(!val('bp').trim()||!(c.base>0))return alert('Enter party name, quantity and rate per piece');const pp=ensureParty(val('bp'));D.bills.push({id:uid(),t:val('bt'),party:pp.name,pid:pp.id,date:val('bd'),qty:c.q,rate:c.r,base:c.base,gr:c.gr,ig:c.ig?1:0,gst:c.gst,amt:c.tot,days:n(val('bc')),paid:0});save();go('Bills')}
function pay(id){const b=D.bills.find(x=>x.id==id),a=n(prompt('Amount received/paid (₹)',b.amt-b.paid));if(!a)return;b.paid=Math.min(b.amt,b.paid+a);save();go('Bills')}
function delB(id){if(confirm('Delete bill?')){D.bills=D.bills.filter(x=>x.id!=id);save();go('Bills')}}

function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...D,app:'Packaging You Need - Manager',v:6,saved:td()})],{type:'application/json'}));a.download='Packaging-You-Need-Manager-backup-'+td()+'.json';a.click()}
const BASE=()=>({cash0:0,fixed:0,items:[],bills:[],exp:[],prods:[],cv:null,chk:{},parties:[],cap:[],myState:'Delhi'});
function imp(el){const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.bills)||!Array.isArray(x.items))throw 0;
if(!confirm('Restore this backup? It replaces the data now in the app ('+D.bills.length+' bills, '+D.items.length+' stock items). You can undo once from Settings.'))return;
try{localStorage.setItem(K+'_prev',JSON.stringify(D))}catch(e){}
D={...BASE(),...x};mig();D.v=6;resnap();save();go('Settings');alert('Restored: '+D.bills.length+' bills, '+D.items.length+' stock items, '+D.exp.length+' expenses, '+D.prods.length+' saved products.')}catch(e){alert('This is not a valid backup file.')}};r.readAsText(fl);el.value=''}
function undoRestore(){try{const q=localStorage.getItem(K+'_prev');if(!q)return alert('Nothing to undo.');D={...BASE(),...JSON.parse(q)};resnap();save();localStorage.removeItem(K+'_prev');go('Settings');alert('Undone. Your data from before the restore is back.')}catch(e){alert('Undo failed.')}}
function wipe(){if(confirm('Erase ALL data? This cannot be undone.'+(cloud()?' Cloud sync is on, so this also erases your data on your other devices.':''))&&confirm('Are you sure?')){D={cash0:0,fixed:0,items:[],bills:[],exp:[],prods:[],cv:null};save();go('Dashboard')}}

function partyView(p){if(!p)return'';const bl=pbills(p),it=D.items.filter(i=>i.pid==p.id||(!i.pid&&i.party==p.name));

function saveParty(){const g2=k=>val('p_'+k).trim(),name=g2('name');if(!name)return alert('Enter the party name');
let gst=g2('gstin').toUpperCase(),pan=g2('pan').toUpperCase();
if(gst&&!GRX.test(gst))return alert('GSTIN looks wrong. It has 15 characters, for example 07ABCDE1234F1Z5. Check it, or leave it blank for an unregistered party.');
if(!pan&&gst)pan=gst.slice(2,12);
if(pan&&!PRX.test(pan))return alert('PAN looks wrong. It has 10 characters, for example ABCDE1234F.');
if(gst&&pan!=gst.slice(2,12)&&!confirm('This PAN does not match the PAN inside the GSTIN. Save anyway?'))return;
if(D.parties.find(p=>p.name.toLowerCase()==name.toLowerCase()&&p.id!=ped))return alert('A party with this name already exists.');
const o={type:val('p_type'),name,legal:g2('legal'),gstin:gst,pan,reg:val('p_reg'),state:val('p_state'),addr:g2('addr'),city:g2('city'),pin:g2('pin'),contact:g2('contact'),phone:g2('phone'),email:g2('email'),days:n(val('p_days')),limit:n(val('p_limit')),udyam:g2('udyam'),bank:g2('bank'),acc:g2('acc'),ifsc:g2('ifsc').toUpperCase(),note:g2('note')};
if(ped){const p=pf(ped);D.bills.forEach(b=>{if(b.pid==p.id)b.party=name});D.items.forEach(i=>{if(i.pid==p.id)i.party=name});Object.assign(p,o)}else D.parties.push({id:uid(),...o});
ped=null;save();go('Accounts')}

function addCash(){const a=n(val('ca'));if(!a)return alert('Enter the amount to add');D.cash0=r2(n(D.cash0)+a);D.cap=D.cap||[];D.cap.push({id:uid(),date:td(),amt:a,note:val('cn').trim()});save();go('Settings')}
function delCap(id){const c=(D.cap||[]).find(x=>x.id==id);if(c&&confirm('Remove this entry? It also takes '+f(c.amt)+' off the opening balance.')){D.cash0=r2(n(D.cash0)-c.amt);D.cap=D.cap.filter(x=>x.id!=id);save();go('Settings')}}

async function tok(){const c=cloud();if(!c)throw Error('Not connected');if(c.id&&Date.now()<c.exp-60000)return c.id;
const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+c.key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(c.rt)});
const j=await r.json();if(!r.ok)throw Error('Login expired. Disconnect and connect again.');
c.id=j.id_token;c.rt=j.refresh_token;c.exp=Date.now()+j.expires_in*1000;localStorage.setItem(K+'_cloud',JSON.stringify(c));return c.id}
async function connect(){const url=val('cu').trim().replace(/\/+$/,''),key=val('ck').trim(),em=val('ce').trim(),pw=val('cw');
if(!/^https:\/\//.test(url)||!key||!em||!pw)return alert('Fill the database URL, web API key, email and password.');
try{const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw,returnSecureToken:true})});
const j=await r.json();if(!r.ok)throw Error((j.error&&j.error.message)||'Login failed');
localStorage.setItem(K+'_cloud',JSON.stringify({url,key,em,id:j.idToken,rt:j.refreshToken,exp:Date.now()+j.expiresIn*1000,first:1}));stamp();go('Settings');await sync(1)}catch(e){alert('Could not connect: '+e.message)}}

function merge(R){stamp();D.del=D.del||{};const rr=R.rec||{},rd=R.del||{},c0=cloud(),before=JSON.stringify([COLS.map(c=>D[c]),SCJ(),D.del]);
Object.entries(rd).forEach(([k,v])=>{if(!D.del[k]||D.del[k].t<v.t)D.del[k]=v});
COLS.forEach(c=>{const m={};(D[c]||[]).forEach(r=>m[kk(r.id)]=r);
Object.entries(rr[c]||{}).forEach(([k,r])=>{const l=m[k];if(!l||(r.u||0)>(l.u||0))m[k]=r});
D[c]=Object.entries(m).filter(([k,r])=>{const d=D.del[k];return!(d&&d.t>(r.u||0))}).map(e=>e[1])});
const live={};COLS.forEach(c=>D[c].forEach(r=>live[kk(r.id)]=r.u||0));Object.keys(D.del).forEach(k=>{if(live[k]!=null&&live[k]>D.del[k].t)delete D.del[k]});
const rs=R.sc;if(rs&&((rs.su||0)>(D.su||0)||(c0&&c0.first))){D.cash0=rs.cash0||0;D.fixed=rs.fixed||0;D.myState=rs.myState||D.myState;D.chk=rs.chk||{};D.su=rs.su||0}
return before!==JSON.stringify([COLS.map(c=>D[c]),SCJ(),D.del])}
function pushSet(R){const up={},rr=R.rec||{},rd=R.del||{};
COLS.forEach(c=>(D[c]||[]).forEach(r=>{const k=kk(r.id),x=(rr[c]||{})[k];if(!x||(r.u||0)>(x.u||0))up[`rec/${c}/${k}`]=r}));
Object.entries(D.del).forEach(([k,d])=>{if(!rd[k]||rd[k].t<d.t)up['del/'+k]=d;COLS.forEach(c=>{const x=(rr[c]||{})[k];if(x&&(x.u||0)<d.t)up[`rec/${c}/${k}`]=null})});
if(!R.sc||(D.su||0)>(R.sc.su||0))up.sc={cash0:D.cash0,fixed:D.fixed,myState:D.myState,chk:D.chk||{},su:D.su||0};return up}

try{const t=await tok(),u=c.url+'/pyn.json?auth='+t,r=await fetch(u);if(!r.ok)throw Error('Cloud read failed ('+r.status+'). Check the database rules and your login.');
const R=(await r.json())||{},ch=merge(R);localStorage.setItem(K,JSON.stringify(D));resync0();
const up=pushSet(R);if(Object.keys(up).length){const w=await fetch(u,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(up)});if(!w.ok)throw Error('Cloud write failed ('+w.status+')')}
const cc=cloud();if(cc&&cc.first){delete cc.first;localStorage.setItem(K+'_cloud',JSON.stringify(cc))}
st('Synced at '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));

}catch(e){st(navigator.onLine===false||/fetch/i.test(e.message)?'Offline. Will sync when connected.':'Sync problem: '+e.message)}
syncing=false}
